<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Тестів — Інтерактивні Карти</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7fafc;
            color: #2d3748;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1, h2, h3 {
            margin-bottom: 15px;
            color: #1a202c;
        }

        .header-bar {
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #3182ce;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .primary-btn {
            background-color: #3182ce;
            color: white;
        }

        .primary-btn:hover {
            background-color: #2b6cb0;
        }

        .success-btn {
            background-color: #38a169;
            color: white;
        }

        .success-btn:hover {
            background-color: #2f855a;
        }

        .danger-btn {
            background-color: #e53e3e;
            color: white;
        }

        .danger-btn:hover {
            background-color: #c53030;
        }

        .secondary-btn {
            background-color: #718096;
            color: white;
        }

        .secondary-btn:hover {
            background-color: #4a5568;
        }

        /* Панель інструментів карти */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            background: #edf2f7;
            padding: 10px;
            border-radius: 8px;
        }

        /* Полотно Карти */
        .map-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin-top: 10px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            overflow: hidden;
            background-color: #e2e8f0;
            touch-action: none;
        }

        .map-container img {
            display: block;
            max-width: 100%;
            height: auto;
            user-select: none;
        }

        .map-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Список створених завдань */
        .task-item {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-display {
            background: #ebf8ff;
            border: 2px dashed #3182ce;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }

        .code-display span {
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: bold;
            color: #2b6cb0;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h1>Конструктор Карт та Тестів</h1>
            <a href="admin.html" class="btn secondary-btn">📊 Журнал оцінок</a>
        </div>

        <!-- Налаштування тесту -->
        <section class="form-group">
            <label for="testTitle">Назва тесту / практичної роботи:</label>
            <input type="text" id="testTitle" placeholder="Наприклад: Фізична карта України. Гори та рівнини">
        </section>

        <section class="form-group">
            <label for="mapUrl">Посилання на зображення карти (URL):</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="mapUrl" placeholder="https://example.com/map.jpg">
                <button id="loadMapBtn" class="btn primary-btn">Завантажити</button>
            </div>
        </section>

        <!-- Зона редагування завдання -->
        <div id="editorArea" style="display: none; margin-top: 25px;">
            <hr style="border: 0; border-top: 1px solid #edf2f7; margin-bottom: 20px;">
            <h2>Додавання завдання</h2>

            <div class="form-group">
                <label for="taskInstruction">Інструкція для учня:</label>
                <input type="text" id="taskInstruction" placeholder="Наприклад: Позначте на карті найвищу точку Українських Карпат (Говерлу)">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label for="taskType">Тип елемента:</label>
                    <select id="taskType">
                        <option value="point">Точка / Мітка</option>
                        <option value="line">Лінія / Маршрут</option>
                        <option value="polygon">Область / Полігон</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskPoints">Максимальний бал:</label>
                    <input type="number" id="taskPoints" value="2" min="1" max="100">
                </div>
            </div>

            <div class="toolbar">
                <button id="clearCurrentShapeBtn" class="btn danger-btn">Очистити поточний контур</button>
                <span style="font-size: 0.85rem; color: #718096; align-self: center;">Клацайте по карті, щоб нанести еталонну відповідь.</span>
            </div>

            <!-- Полотно Карти -->
            <div class="map-container">
                <img id="teacherMapImage" src="" alt="Карта для редагування">
                <canvas id="teacherCanvas"></canvas>
            </div>

            <button id="addTaskBtn" class="btn success-btn" style="margin-top: 15px;">➕ Додати це завдання до тесту</button>

            <!-- Список вже доданих завдань -->
            <section style="margin-top: 30px;">
                <h3>Завдання в цьому тесті:</h3>
                <div id="tasksList" style="margin-top: 10px;">
                    <p style="color: #a0aec0; font-style: italic;">Завдань поки немає. Створіть перше завдання вище.</p>
                </div>
            </section>

            <!-- Збереження та створення тесту -->
            <div style="margin-top: 30px; border-top: 2px solid #edf2f7; padding-top: 20px;">
                <button id="saveTestBtn" class="btn primary-btn" style="font-size: 1.1rem; padding: 12px 24px;">💾 Зберегти та згенерувати код</button>
            </div>

            <!-- Блок згенерованого коду -->
            <div id="generatedCodeSection" class="code-display" style="display: none;">
                <p>Тест успішно збережено! Передайте цей код учням:</p>
                <span id="testCodeDisplay">XXXXXXXXXX</span>
            </div>
        </div>
    </div>

    <!-- ГОЛОВНИЙ СКРИПТ ЛОГІКИ (ES МОДУЛЬ) -->
    <script type="module" src="script.js"></script>
</body>
</html>
