<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Вчителя — Інтерактивні Карти</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7fafc;
            color: #2d3748;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1, h2, h3, h4 {
            margin-bottom: 15px;
            color: #1a202c;
        }

        .header-bar {
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #475569;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #3182ce;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .primary-btn {
            background-color: #3182ce;
            color: white;
        }

        .primary-btn:hover {
            background-color: #2b6cb0;
        }

        .danger-btn {
            background-color: #e53e3e;
            color: white;
        }

        .danger-btn:hover {
            background-color: #c53030;
        }

        .map-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin-top: 15px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            overflow: hidden;
            background-color: #e2e8f0;
            touch-action: none;
        }

        .map-container img {
            display: block;
            max-width: 100%;
            height: auto;
            user-select: none;
        }

        .map-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .share-box {
            background: #f0fff4;
            border: 1px solid #c6f6d5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h1>Панель Вчителя (Конструктор тесту)</h1>
        </div>

        <!-- КРОК 1: Основна інформація -->
        <section class="form-group">
            <div class="grid-2">
                <div>
                    <label for="testTitle">Назва тесту / теми:</label>
                    <input type="text" id="testTitle" placeholder="Наприклад: Географія України. Обласні центри">
                </div>
                <div>
                    <label for="teacherChatId">Telegram Chat ID (для сповіщень):</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="teacherChatId" placeholder="Ваш Chat ID">
                        <button type="button" id="getChatIdBtn" class="btn primary-btn" style="white-space: nowrap;">📲 Отримати свій ID</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- КРОК 2: Джерело зображення карти -->
        <section class="form-group">
            <label>Завантажити карту (Файл з ПК або URL):</label>
            <div class="grid-2">
                <div>
                    <input type="file" id="mapFileInput" accept="image/*">
                </div>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="mapUrl" placeholder="https://example.com/map.jpg">
                    <button type="button" id="loadMapBtn" class="btn primary-btn">Завантажити</button>
                </div>
            </div>
        </section>

        <!-- Рабочая область конструктора -->
        <div id="editorArea" style="display: none;">
            <div class="map-container">
                <img id="teacherMapImage" src="" alt="Інтерактивна Карта">
                <canvas id="teacherCanvas"></canvas>
            </div>

            <!-- Форма створення завдання -->
            <section style="margin-top: 25px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                <h3>Додати нове завдання</h3>
                
                <div class="form-group">
                    <label for="taskInstruction">Текст завдання / Інструкція для учня:</label>
                    <input type="text" id="taskInstruction" placeholder="Наприклад: Знайдіть та позначте місто Київ">
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="taskType">Тип завдання:</label>
                        <select id="taskType">
                            <option value="point">📌 Мітка (1 точка)</option>
                            <option value="multi-point">📌📌 Кілька міток (2+ точок)</option>
                            <option value="line">📏 Лінія / Маршрут</option>
                            <option value="polygon">🔷 Область / Полігон</option>
                            <option value="donut">🍩 Область із вирізкою (Пончик)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPoints">Максимальний бал:</label>
                        <input type="number" id="taskPoints" value="2" min="1">
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="button" id="clearCurrentShapeBtn" class="btn danger-btn">Очистити контур</button>
                    <button type="button" id="addTaskBtn" class="btn primary-btn">+ Додати завдання</button>
                </div>
            </section>

            <!-- Список створених завдань -->
            <section style="margin-top: 25px;">
                <h4>Список завдань поточного тесту:</h4>
                <div id="tasksList" style="margin-top: 10px;"></div>
            </section>

            <!-- Публікація -->
            <div style="margin-top: 25px; border-top: 2px solid #edf2f7; padding-top: 20px;">
                <button type="button" id="saveTestBtn" class="btn primary-btn" style="background-color: #38a169; font-size: 1.1rem; padding: 12px 24px;">🚀 Зберегти та згенерувати код</button>
            </div>

            <div id="generatedCodeSection" class="share-box" style="display: none;">
                <h4>🎉 Тест успішно створено!</h4>
                <p style="margin-top: 5px;">Код вашого тесту: <b id="testCodeDisplay" style="font-size: 1.3rem; color: #3182ce;"></b></p>
            </div>
        </div>

        <!-- Історія тестів -->
        <section style="margin-top: 40px; border-top: 2px solid #edf2f7; padding-top: 20px;">
            <h3>Ваші створені тести</h3>
            <div id="teacherHistoryList" style="margin-top: 10px;"></div>
        </section>

        <!-- Журнал оцінок -->
        <section style="margin-top: 40px; border-top: 2px solid #edf2f7; padding-top: 20px;">
            <h3>Журнал оцінок (Результати учнів)</h3>
            <div id="adminJournalContainer" style="margin-top: 10px;"></div>
        </section>
    </div>

    <!-- ГОЛОВНИЙ СКРИПТ ЛОГІКИ (Module для підтримки Firebase v10) -->
    <script type="module" src="script.js"></script>
</body>
</html>
