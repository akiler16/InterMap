<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пройти тест — Інтерактивні Карти</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7fafc;
            color: #2d3748;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1, h2, h3 {
            margin-bottom: 15px;
            color: #1a202c;
        }

        .header-bar {
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            max-width: 500px;
            margin-bottom: 20px;
        }

        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #3182ce;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .primary-btn {
            background-color: #3182ce;
            color: white;
        }

        .primary-btn:hover {
            background-color: #2b6cb0;
        }

        .success-btn {
            background-color: #38a169;
            color: white;
        }

        .success-btn:hover {
            background-color: #2f855a;
        }

        /* Полотно Карти */
        .map-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin-top: 15px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            overflow: hidden;
            background-color: #e2e8f0;
            touch-action: none;
        }

        .map-container img {
            display: block;
            max-width: 100%;
            height: auto;
            user-select: none;
        }

        .map-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .instruction-box {
            background-color: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 12px;
            margin: 15px 0;
            border-radius: 0 6px 6px 0;
            font-size: 0.95rem;
        }

        /* Картки завдань */
        .student-task-card {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .student-task-card:hover {
            border-color: #cbd5e0;
            background: #edf2f7;
        }

        .student-task-card.active-task {
            border-color: #3182ce;
            background-color: #ebf8ff;
        }

        .student-task-card.completed-task {
            border-left: 6px solid #38a169;
        }

        /* Результати */
        .results-box {
            background: #f0fff4;
            border: 1px solid #c6f6d5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
        }

        .report-details {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            margin-top: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- КРОК 1: Введення коду (якщо не передано в URL) -->
        <section id="codeLoaderSection" class="header-bar">
            <h1>Проходження Тесту</h1>
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #718096;">Введіть код тесту, отриманий від вчителя:</p>
            <div style="display: flex; gap: 10px; max-width: 400px;">
                <input type="text" id="studentCodeInput" placeholder="Код тесту (наприклад: A1b2C3d4E5)">
                <button id="loadTestBtn" class="btn primary-btn">Завантажити</button>
            </div>
        </section>

        <!-- КРОК 2: Виконання тесту -->
        <div id="testArea" style="display: none;">
            <div class="header-bar">
                <h1 id="displayTestTitle">Назва тесту</h1>
                <p style="color: #718096; font-size: 0.9rem;">Оберіть завдання зі списку, прочитайте інструкцію та виконайте його на карті.</p>
            </div>

            <!-- Введення даних учня -->
            <div class="form-grid">
                <div class="form-group">
                    <label for="studentName">Ім'я та Прізвище учня:</label>
                    <input type="text" id="studentName" placeholder="Іван Іваненко" required>
                </div>
                <div class="form-group">
                    <label for="studentClass">Клас:</label>
                    <input type="text" id="studentClass" placeholder="9-А" required>
                </div>
            </div>

            <!-- Полотно Карти та інструкція -->
            <div id="studentInstruction" class="instruction-box">
                👈 Оберіть завдання зі списку нижче, щоб розпочати виконання.
            </div>

            <div class="map-container">
                <img id="studentMapImage" src="" alt="Інтерактивна Карта">
                <canvas id="studentCanvas"></canvas>
            </div>

            <!-- Список завдань -->
            <section style="margin-top: 25px;">
                <h3>Завдання тесту:</h3>
                <div id="studentTasksContainer" style="margin-top: 12px;"></div>
            </section>

            <!-- Завершення -->
            <div style="margin-top: 30px; border-top: 2px solid #edf2f7; padding-top: 20px;">
                <button id="submitWorkBtn" class="btn success-btn" style="font-size: 1.1rem; padding: 12px 24px;">🚀 Здати роботу</button>
            </div>

            <!-- Блок Результатів -->
            <section id="resultsSection" class="results-box" style="display: none;">
                <h2>Результати перевірки</h2>
                <h3 id="scoreSummary" style="color: #2f855a; margin-top: 8px;">Набрано балів: 0 з 0</h3>
                <div id="detailedReport" class="report-details"></div>
            </section>
        </div>
    </div>

    <!-- ГОЛОВНИЙ СКРИПТ ЛОГІКИ (ES МОДУЛЬ) -->
    <script type="module" src="script.js"></script>
</body>
</html>
